# Builds the iPhone/iPad app (Marquee.ipa) and the Apple TV app (MarqueeTV.ipa) on GitHub's Macs — no Mac needed.
# Push this folder to a GitHub repo, open the Actions tab, pick "Build iOS app" and press "Run workflow".
# The finished apps appear under "Artifacts" at the bottom of the run.
name: Build iOS app

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Pick Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)" && xcodebuild -version

      - name: Make the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build iPhone & iPad app (unsigned — Sideloadly / SideStore signs it with your Apple ID)
        run: |
          set -o pipefail
          xcodebuild -project Marquee.xcodeproj -scheme Marquee -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | tee build-ios.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          test -d build/Build/Products/Release-iphoneos/Marquee.app || { grep -B5 -A20 "error:" build-ios.log | head -150; exit 1; }

      - name: Build Apple TV app
        run: |
          set -o pipefail
          xcodebuild -project Marquee.xcodeproj -scheme MarqueeTV -configuration Release \
            -sdk appletvos -destination 'generic/platform=tvOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | tee build-tv.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          test -d build/Build/Products/Release-appletvos/Marquee.app || { grep -B5 -A20 "error:" build-tv.log | head -150; echo "::warning::Apple TV app didn't build"; }

      - name: Package
        run: |
          # Ad-hoc sign with the entitlements, so the signing tool knows the app and widget share an App Group
          APP=build/Build/Products/Release-iphoneos/Marquee.app
          codesign -f -s - --entitlements MarqueeWidgets/MarqueeWidgets.entitlements "$APP/PlugIns/MarqueeWidgets.appex"
          codesign -f -s - --entitlements Marquee/Marquee.entitlements "$APP"
          mkdir -p ios/Payload && cp -R "$APP" ios/Payload/ && (cd ios && zip -qry ../Marquee.ipa Payload)
          TV=build/Build/Products/Release-appletvos/Marquee.app
          if [ -d "$TV" ]; then mkdir -p tv/Payload && cp -R "$TV" tv/Payload/ && (cd tv && zip -qry ../MarqueeTV.ipa Payload); fi
          ls -la *.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Marquee-ipa
          path: |
            Marquee.ipa
            MarqueeTV.ipa

      - name: Attach to release (when you push a tag like v1.1.0)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Marquee.ipa
            MarqueeTV.ipa
